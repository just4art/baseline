<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d6b4c">
<title>Baseline</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Baseline">
<meta name="description" content="Daily snacks, short guided workouts and a weekly check-in. No account, data stays on your phone.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#edf1ec; --surface:#ffffff; --surface2:#f3f6f1; --text:#14211a; --muted:#5a6a61; --line:#d4ddd5;
  --accent:#1d6b4c; --accent-ink:#ffffff; --ball:#cfe33f; --ball-ink:#1b2408;
  --rest:#2f6aa8; --warm:#b5562c; --good:#1d7a4a; --bad:#b4382a;
  --h0:#e3e9e2; --h1:#c4e2cf; --h2:#86c3a0; --h3:#3f9a6c; --h4:#1b6445;
  --shadow:0 6px 18px rgba(20,33,26,.10);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0b120e; --surface:#131c17; --surface2:#1a251f; --text:#e7eee9; --muted:#98a99f; --line:#29372f;
    --accent:#5fd09b; --accent-ink:#04130b; --ball:#d8ec52; --ball-ink:#1b2408;
    --rest:#7fb3ec; --warm:#ef9466; --good:#64d39c; --bad:#f07d6e;
    --h0:#1b2620; --h1:#1f4332; --h2:#2c6a4b; --h3:#45a174; --h4:#7fe0ad;
    --shadow:0 6px 18px rgba(0,0,0,.45);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0b120e; --surface:#131c17; --surface2:#1a251f; --text:#e7eee9; --muted:#98a99f; --line:#29372f;
  --accent:#5fd09b; --accent-ink:#04130b; --ball:#d8ec52; --ball-ink:#1b2408;
  --rest:#7fb3ec; --warm:#ef9466; --good:#64d39c; --bad:#f07d6e;
  --h0:#1b2620; --h1:#1f4332; --h2:#2c6a4b; --h3:#45a174; --h4:#7fe0ad;
  --shadow:0 6px 18px rgba(0,0,0,.45);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
h1,h2,h3,.cond{font-family:"Barlow Condensed",system-ui,sans-serif;font-weight:700;letter-spacing:.2px;margin:0}
h1{font-size:30px;line-height:1}
h2{font-size:24px;line-height:1.1}
h3{font-size:13px;text-transform:uppercase;letter-spacing:1.2px;color:var(--muted);font-weight:600;margin:0 0 8px}
p{margin:6px 0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.muted{color:var(--muted)} .small{font-size:13px} .tiny{font-size:12px}
.page{max-width:560px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top,0px)) 16px calc(96px + env(safe-area-inset-bottom,0px))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin:12px 0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.btn{border:1.5px solid var(--line);background:var(--surface2);border-radius:12px;padding:9px 16px;font-weight:600}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ball{background:var(--ball);border-color:var(--ball);color:var(--ball-ink)}
.btn.big{padding:14px 22px;font-size:18px;width:100%}
.btn.sm{padding:5px 11px;font-size:13px;border-radius:10px}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.45;cursor:default}
.link{background:none;border:none;padding:0;color:var(--accent);font-weight:600;text-decoration:underline;text-underline-offset:3px}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600;background:var(--surface2);border:1px solid var(--line);white-space:nowrap}
.chip.acc{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

/* header */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-bottom:4px}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:34px;height:34px;flex:none}
.date{color:var(--muted);font-size:13px}

/* hero next-session */
.hero{position:relative;overflow:hidden;background:var(--accent);color:var(--accent-ink);border:none;padding:18px}
.hero .lines{position:absolute;inset:0;opacity:.14;pointer-events:none}
.hero h2{font-size:34px;margin:2px 0 4px}
.hero .meta{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 10px}
.hero .meta .chip{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.28);color:inherit}
.hero p{opacity:.92;max-width:44ch}
.hero .btn.big{margin-top:12px}
.hero .sub{display:flex;justify-content:space-between;align-items:center;margin-top:10px;gap:8px;flex-wrap:wrap}
.hero .link{color:inherit}
.switch{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;cursor:pointer;user-select:none}
.switch input{appearance:none;width:36px;height:22px;border-radius:999px;background:rgba(127,127,127,.35);position:relative;margin:0;cursor:pointer;flex:none;transition:background .15s}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .15s}
.switch input:checked{background:var(--ball)}
.switch input:checked::after{transform:translateX(14px);background:var(--ball-ink)}
.card:not(.hero) .switch input:checked{background:var(--accent)}
.card:not(.hero) .switch input:checked::after{background:var(--accent-ink)}
.done-banner{display:flex;gap:12px;align-items:center;background:var(--surface);border:1.5px solid var(--accent);border-radius:16px;padding:12px 14px;margin:12px 0}
.done-banner .tick{width:36px;height:36px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:800;flex:none}

/* week strip */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:8px}
.wd{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:var(--muted)}
.wd .dot{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--text)}
.wd .dot.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.wd .dot.other{background:var(--h2);border-color:var(--h2);color:var(--text)}
.wd.today .dot{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--ball)}
.goalbar{height:8px;background:var(--surface2);border-radius:999px;overflow:hidden;margin-top:10px}
.goalbar i{display:block;height:100%;background:var(--accent);border-radius:999px}

/* trackers */
.snack .nm small.times{white-space:normal}
.add.sm{min-width:46px;height:40px;font-size:14px}
.add.wide{padding:0 12px}
.step{display:flex;align-items:center;justify-content:space-between;gap:6px;border-top:1px solid var(--line);padding:10px 0}
.step:first-of-type{border-top:none}
.step .lb{font-weight:700;min-width:28px}
.step .tm{font-family:"Barlow Condensed",sans-serif;font-size:24px;font-weight:700;min-width:62px;text-align:center}
.step .ctl{display:flex;gap:6px;align-items:center}
.step .lb{min-width:44px}
.tin.sm{flex:1;font-size:18px;min-height:44px;padding:6px 10px;width:auto}
.night{border-top:1px solid var(--line);padding:12px 0}
.szgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.szb{border:1.5px solid var(--accent);background:var(--surface);color:var(--text);border-radius:14px;padding:16px 10px;text-align:center;touch-action:manipulation}
.szb b{display:block;font-family:"Barlow Condensed",sans-serif;font-size:26px;color:var(--accent)}
.szb span{font-size:13px;color:var(--muted)}
.szb:active{transform:scale(.96)}
.szrow{gap:6px;margin:-4px 0 8px 34px}
.naprow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:10px}
.naprow .small{margin-right:2px}
.night:first-of-type{border-top:none}
.night .row{margin-top:6px}
.tl{flex:1;display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted);font-weight:600}
.tin{font:inherit;font-size:20px;font-weight:700;color:var(--text);background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:8px 10px;min-height:48px;width:100%;-webkit-appearance:none;appearance:none}

/* tip */
.tip{border-left:4px solid var(--ball);background:var(--surface)}
.tip b{display:block;margin-bottom:2px}

/* plan */
.tpl{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:8px 0}
.tpl .ic{font-size:26px;width:40px;text-align:center;flex:none}
.tpl .nm{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:21px;line-height:1.1}
.tpl.next{border:2px solid var(--accent)}
.tpl .go{margin-left:auto;color:var(--muted);font-size:20px}
.levels{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.lvl{border:1.5px solid var(--line);background:var(--surface2);border-radius:12px;padding:8px 4px;text-align:center}
.lvl b{display:block;font-family:"Barlow Condensed",sans-serif;font-size:22px;line-height:1}
.lvl span{font-size:11.5px;color:var(--muted)}
.lvl.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.lvl.on span{color:inherit;opacity:.85}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px));box-shadow:var(--shadow)}
@media (min-width:640px){.scrim{align-items:center}.sheet{border-radius:20px;max-height:84vh}}
.grp{margin:14px 0 4px;display:flex;justify-content:space-between;align-items:baseline}
.mv{border:1px solid var(--line);background:var(--surface);border-radius:12px;margin:6px 0}
.mv summary{list-style:none;cursor:pointer;padding:10px 12px;display:flex;justify-content:space-between;gap:8px;font-weight:600}
.mv summary::-webkit-details-marker{display:none}
.mv summary::after{content:"+";color:var(--muted);font-weight:700}
.mv[open] summary::after{content:"–"}
.mv .bd{padding:0 12px 10px;font-size:14px}
.mv .bd .ez{color:var(--muted)}
.field{display:flex;flex-direction:column;gap:4px;flex:1;min-width:120px}
.field label{font-size:12.5px;font-weight:600;color:var(--muted)}
.field input,.field select,textarea{background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:9px 10px;width:100%}
textarea{min-height:64px;resize:vertical}

/* progress */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.stat b{display:block;font-family:"Barlow Condensed",sans-serif;font-size:32px;line-height:1}
.stat span{font-size:12.5px;color:var(--muted)}
.heat{display:grid;grid-template-columns:22px repeat(12,1fr);gap:4px;align-items:center}
.heat .c{aspect-ratio:1;border-radius:4px;background:var(--h0)}
.heat .c.l1{background:var(--h1)} .heat .c.l2{background:var(--h2)} .heat .c.l3{background:var(--h3)} .heat .c.l4{background:var(--h4)}
.heat .c.fut{background:transparent;border:1px dashed var(--line)}
.heat .c.td{outline:2px solid var(--ball);outline-offset:1px}
.heat .lb{font-size:10.5px;color:var(--muted)}
.heat .mh{font-size:10.5px;color:var(--muted);text-align:left;white-space:nowrap;overflow:visible}
.legend{display:flex;align-items:center;gap:4px;font-size:11.5px;color:var(--muted);margin-top:8px;justify-content:flex-end}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;touch-action:pan-y}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .ax{fill:var(--muted);font-size:10.5px}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .pt{fill:var(--accent);stroke:var(--surface);stroke-width:2}
.chart .xh{stroke:var(--muted);stroke-width:1;stroke-dasharray:3 3}
.chart .hp{fill:var(--accent);stroke:var(--surface);stroke-width:2}
#tip{position:fixed;z-index:80;pointer-events:none;background:var(--text);color:var(--bg);font-size:12.5px;padding:6px 9px;border-radius:8px;box-shadow:var(--shadow);opacity:0;transition:opacity .08s;max-width:220px;line-height:1.35}
#tip.on{opacity:1}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:7px 4px;border-top:1px solid var(--line)}
th{font-size:12px;color:var(--muted);font-weight:600;border-top:none}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.x{background:none;border:none;color:var(--muted);font-size:16px;padding:2px 6px}
.hist{display:flex;justify-content:space-between;gap:8px;padding:9px 0;border-top:1px solid var(--line);align-items:center}
.hist:first-child{border-top:none}

/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav.tabs button{background:none;border:none;padding:9px 0 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:600;color:var(--muted)}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button.on{color:var(--accent)}

/* player */
#player{position:fixed;inset:0;z-index:60;background:var(--bg);display:none;flex-direction:column}
#player.on{display:flex}
.pl-top{display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 8px;max-width:560px;width:100%;margin:0 auto}
.pl-top .ph{font-weight:700;font-size:14px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl-top .rm{font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px}
.ib{width:40px;height:40px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none;padding:0;font-size:18px}
.pbar{height:5px;background:var(--surface2);max-width:528px;width:calc(100% - 32px);margin:0 auto;border-radius:999px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--accent);width:0}
.pl-main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:safe center;text-align:center;padding:10px 20px;max-width:560px;width:100%;margin:0 auto;min-height:0;overflow:auto}
.kind{font-size:13px;font-weight:800;letter-spacing:2px;text-transform:uppercase;padding:4px 12px;border-radius:999px;background:var(--surface2)}
#player[data-k="work"] .kind{background:var(--accent);color:var(--accent-ink)}
#player[data-k="rest"] .kind{background:var(--rest);color:#fff}
#player[data-k="ready"] .kind{background:var(--ball);color:var(--ball-ink)}
#player[data-k="warm"] .kind{background:var(--warm);color:#fff}
.mvname{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:clamp(30px,8vw,46px);line-height:1.02;margin:8px 0 0}
.mvsub{color:var(--muted);font-weight:600;min-height:1.4em}
.ring{position:relative;width:min(32vw,138px);aspect-ratio:1;margin:10px 0 6px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .tr{fill:none;stroke:var(--surface2);stroke-width:9}
.ring .pr{fill:none;stroke:var(--accent);stroke-width:9;stroke-linecap:round;transition:stroke-dashoffset .2s linear}
#player[data-k="rest"] .ring .pr{stroke:var(--rest)}
#player[data-k="warm"] .ring .pr{stroke:var(--warm)}
#player[data-k="ready"] .ring .pr{stroke:var(--ball)}
.ring .num{position:absolute;inset:0;display:grid;place-items:center;font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:clamp(40px,11vw,58px);font-variant-numeric:tabular-nums}
.how{max-width:40ch;font-size:15.5px}
.ez{color:var(--muted);font-size:14px;margin-top:4px}
.nextup{margin-top:10px;font-size:14px;color:var(--muted)}
.nextup b{color:var(--text)}
.flash{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);background:var(--ball);color:var(--ball-ink);font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:30px;padding:10px 22px;border-radius:14px;opacity:0;pointer-events:none;transition:opacity .2s;box-shadow:var(--shadow)}
.flash.on{opacity:1}
.pl-ctl{display:flex;justify-content:center;gap:18px;padding:12px 16px calc(22px + env(safe-area-inset-bottom,0px))}
.cb{width:62px;height:62px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);display:grid;place-items:center;padding:0}
.cb.main{width:78px;height:78px;background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.cb svg{width:26px;height:26px}
.cb.main svg{width:32px;height:32px}
#player.paused .ring .num{opacity:.45}
.rate{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%;max-width:420px;margin:12px 0}
.rate button{border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 4px;font-weight:700}
.rate button span{display:block;font-size:26px}
.rate button.on{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:9px 16px;border-radius:12px;font-weight:600;font-size:14px;z-index:90;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
/* stick figures */
.fg{fill:none;stroke:var(--text);stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
.fg.far{stroke:var(--muted);opacity:.55}
.fg-h{fill:var(--text)}
.fg-g{stroke:var(--line);stroke-width:1.5;stroke-linecap:round}
.fg-p{fill:var(--surface2);stroke:var(--line);stroke-width:1.2}
.fg-pl{fill:none;stroke:var(--muted);stroke-width:2.4;stroke-linecap:round;opacity:.7}
.fg-rk line{stroke:var(--accent);stroke-width:2.4;stroke-linecap:round}
.fg-rk ellipse{fill:none;stroke:var(--accent);stroke-width:2}
.fg-pk{fill:var(--accent);opacity:.85}
.figbox{width:min(70vw,290px);aspect-ratio:120/112;margin:6px 0 0;background:var(--surface);border:1px solid var(--line);border-radius:18px}
.figbox svg{display:block;width:100%;height:100%}
#player[data-k="rest"] .figbox,#player[data-k="ready"] .figbox{opacity:.6}
.mfig{display:block;width:150px;height:140px;float:right;margin:0 0 6px 10px;background:var(--surface2);border-radius:12px}
.mv .bd::after{content:"";display:block;clear:both}
@media (max-height:720px){.figbox{width:min(46vw,175px)}.ring{width:96px;margin:6px 0 2px}.ring .num{font-size:38px}.mvname{font-size:30px;margin-top:4px}.how{font-size:14px}.pl-ctl{padding-top:6px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}.cb{width:54px;height:54px}.cb.main{width:66px;height:66px}}
/* session length picker + comeback */
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:12px}
.seg button{border:1.5px solid rgba(255,255,255,.28);background:rgba(255,255,255,.1);color:inherit;border-radius:12px;padding:7px 4px;line-height:1.15}
.seg button b{display:block;font-size:15px}
.seg button span{font-size:12px;opacity:.85}
.seg button.on{background:var(--ball);border-color:var(--ball);color:var(--ball-ink)}
.comeback{border:2px solid var(--ball)}
/* snacks */
.place{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:12px 0 0}
.place button{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:9px;font-weight:700;font-size:15px}
.place button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.snackhead{display:flex;align-items:center;gap:14px;margin-bottom:4px}
.snackhead h2{font-size:26px}
.dayring{width:62px;height:62px;flex:none;position:relative}
.dayring svg{width:100%;height:100%;transform:rotate(-90deg)}
.dayring circle{fill:none;stroke-width:7}
.dayring .bgc{stroke:var(--surface2)}
.dayring .fgc{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .3s}
.dayring b{position:absolute;inset:0;display:grid;place-items:center;font-family:"Barlow Condensed",sans-serif;font-size:19px}
.snack{border-top:1px solid var(--line);padding:11px 0 10px}
.snack.first{border-top:none}
.snack .r{display:flex;align-items:center;gap:8px}
.snack .nm{flex:1;min-width:0;text-align:left;background:none;border:none;padding:0;font-weight:700;font-size:16px;color:var(--text)}
.snack .nm small{display:block;font-weight:500;color:var(--muted);font-size:12.5px}
.snack .cnt{background:none;border:none;padding:0 2px;font-family:"Barlow Condensed",sans-serif;font-size:23px;font-weight:700;min-width:58px;text-align:right;color:var(--text)}
.snack .cnt span{font-size:14px;color:var(--muted);font-weight:600}
.add{min-width:56px;height:46px;border-radius:12px;border:1.5px solid var(--accent);background:var(--surface);color:var(--accent);font-weight:800;font-size:16px;touch-action:manipulation}
.add.big{background:var(--accent);color:var(--accent-ink)}
.add:active{transform:scale(.94)}
.sbar{height:5px;background:var(--surface2);border-radius:999px;margin-top:8px;overflow:hidden}
.sbar i{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .3s}
.sbar i.full{background:var(--ball)}
.wd .dot.snack{background:var(--h1);border-color:var(--h1);color:var(--text)}
.nudge{border:2px solid var(--accent)}
.toast.act{pointer-events:auto;display:flex;gap:16px;align-items:center}
.toast button{background:none;border:none;color:inherit;font-weight:800;padding:0;text-decoration:underline;text-underline-offset:3px}
.install{border:2px dashed var(--accent)}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:4px 0 12px}
.scale.w8{grid-template-columns:repeat(8,1fr)}
.scale label{position:relative}
.scale input{position:absolute;opacity:0;pointer-events:none}
.scale span{display:grid;place-items:center;height:40px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);font-weight:700}
.scale input:checked + span{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.scale input:focus-visible + span{outline:3px solid var(--accent);outline-offset:2px}
.sset{display:grid;grid-template-columns:1fr auto auto 70px;gap:8px;align-items:center}
.sset .h{font-size:12px;color:var(--muted);font-weight:600}
.tog{border:1.5px solid var(--line);background:var(--surface2);border-radius:999px;padding:4px 10px;font-size:12.5px;font-weight:600}
.tog.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.sset input{background:var(--surface);border:1.5px solid var(--line);border-radius:8px;padding:5px 6px;width:100%;text-align:right}
textarea.rep{font:12.5px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;height:46vh;resize:vertical}
table.mini{width:100%;border-collapse:collapse;font-size:14px}
table.mini td,table.mini th{padding:6px 4px;border-top:1px solid var(--line);text-align:left}
table.mini th{font-size:12px;color:var(--muted);font-weight:600;border-top:none}
table.mini .num{text-align:right;font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

/* ================= session building ================= */
function pick(slot, v){ return Array.isArray(slot) ? slot[v % slot.length] : slot; }
function buildSession(tid, level, variant, mode='full'){
  const t = TPL[tid], L = LEVELS[level], steps = [];
  const fx = t.mainFixed;
  let work = fx ? fx.work : L.work, rest = fx ? fx.rest : L.rest;
  let rounds = fx ? fx.rounds : L.rounds;
  let cWork = L.cWork, cRest = L.cRest, cRounds = Math.min(L.cRounds, t.coreMax || 9);
  let ready = 10, gap = 15, coreGap = 20;
  let warm = t.warm.map(s=>pick(s,variant)), cool = t.cool.map(s=>pick(s,variant));
  let main = t.main.map(s=>pick(s,variant));
  if(mode==='short'){
    rounds = Math.max(1, rounds-1); cRounds = 1;
    warm = warm.slice(0,4); cool = cool.slice(-2);
    if(fx) main = main.slice(0,7);
  }else if(mode==='mini'){
    // the "better than nothing" day: same moves, one pass, fixed easy timings
    ready = 5; gap = 10; coreGap = 15;
    warm = warm.slice(0,3); main = main.slice(0,4); cool = cool.slice(-1);
    work = 30; rest = 15; rounds = 1; cWork = 30; cRest = 15; cRounds = 1;
  }
  const core = t.core.map(s=>pick(s,variant));
  const W = (id, dur, phase, kind='work') => steps.push({kind, id, dur, phase, side:!!LIB[id].side});
  const R = (dur, phase, label='Rest') => steps.push({kind:'rest', dur, phase, label});

  steps.push({kind:'ready', dur:ready, phase:'Get ready', label:'Get ready'});
  warm.forEach(id => W(id, 30, 'Warm-up', 'warm'));
  if(warm.length) R(gap, 'Warm-up', 'Get set');
  const mainName = fx ? 'Mobility flow' : 'Circuit';
  for(let r=1; r<=rounds; r++){
    main.forEach((id,i) => {
      const ph = rounds>1 ? `${mainName} · round ${r} of ${rounds}` : mainName;
      W(id, work, ph);
      if(i < main.length-1 && rest>0) R(rest, ph);
    });
    if(r < rounds) R(60, `${mainName} · round ${r} of ${rounds}`, 'Round break');
  }
  R(coreGap, 'Core', 'Get down for core');
  for(let r=1; r<=cRounds; r++){
    core.forEach((id,i) => {
      const ph = cRounds>1 ? `Core · round ${r} of ${cRounds}` : 'Core';
      W(id, cWork, ph);
      if(i < core.length-1) R(cRest, ph);
    });
    if(r < cRounds) R(30, `Core · round ${r} of ${cRounds}`, 'Round break');
  }
  R(10, 'Cool-down', 'Cool-down next');
  cool.forEach(id => W(id, 40, 'Cool-down', 'warm'));
  // attach "next" to every step
  for(let i=steps.length-1, nxt=null; i>=0; i--){ steps[i].next = nxt; if(steps[i].id) nxt = steps[i].id; }
  return steps;
}
const totalSecs = steps => steps.reduce((a,s)=>a+s.dur,0);
function groupsOf(steps){
  // condensed view for previews: unique moves per phase family
  const fam = p => p.startsWith('Circuit')?'Circuit':p.startsWith('Mobility')?'Mobility flow':p.startsWith('Core')?'Core':p;
  const out = [];
  steps.forEach(s => {
    if(!s.id) return;
    const f = fam(s.phase);
    let g = out.find(x=>x.name===f);
    if(!g){ g = {name:f, ids:[], dur:s.dur, rounds:1}; out.push(g); }
    if(!g.ids.includes(s.id)) g.ids.push(s.id);
    const m = s.phase.match(/of (\d+)/); if(m) g.rounds = +m[1];
  });
  return out;
}

function gapDays(){ const last = lastActiveKey(); return last ? Math.round((parseKey(dkey()) - parseKey(last))/864e5) : null; }
const comebackGap = () => { const g = gapDays(); return g!=null && g>=3 ? g : 0; };
// after a gap, default to the 8-minute version until the user picks a length themselves today
const curMode = () => (comebackGap() && S.settings.modeSetOn !== dkey()) ? 'mini' : S.settings.mode;
function dayInfo(k){
  const ss = S.sessions.filter(s=>s.date===k);
  const sn = snackTotals(k), snack = Object.values(sn).some(v=>v>0);
  return {ss, g:ss.filter(s=>s.kind==='guided'), o:ss.filter(s=>s.kind==='other'), sn, snack, active: ss.length>0 || snack};
}
function dayScore(k){
  const d = dayInfo(k);
  let s = 0;
  if(d.g.length) s = 3; else if(d.o.length || (d.snack && snackPct(k)>=1)) s = 2; else if(d.snack) s = 1;
  if(s>=1 && d.snack && d.g.length) s++;
  return Math.min(4, s);
}
function activeDaysInWeek(mon){
  let n = 0;
  for(let i=0;i<7;i++){ if(dayInfo(dkey(addDays(mon,i))).active) n++; }
  return n;
}
function weekStreak(){
  const goal = S.settings.goal;
  let mon = mondayOf(new Date()), n = 0;
  if(activeDaysInWeek(mon) >= goal) n++;
  for(let w=1; w<200; w++){
    const m = addDays(mon, -7*w);
    if(activeDaysInWeek(m) >= goal) n++; else break;
  }
  return n;
}

/* ---------- small steps up, one at a time ---------- */
function nudge(){
  const now = new Date(), today = dkey(now), wk = dkey(mondayOf(now)), off = S.settings.nudgeOff;
  const last7 = [...Array(7)].map((_,i)=>dkey(addDays(now,-i-1)));
  const weekAgo = dkey(addDays(now,-7));
  // a target that keeps getting hit → offer a bigger one
  for(const s of SNACKS){
    const c = snackCfg(s.id); if(!c.home && !c.office) continue;
    const key = `bump-${s.id}-${wk}`;
    if(off[key] || (S.settings.bumped[s.id]||'') > weekAgo) continue;
    const hits = last7.filter(k=>(snackTotals(k)[s.id]||0) >= c.t).length;
    if(hits >= 4){
      const to = roundUp(s, Math.max(c.t*1.2, c.t + s.add[0]));
      return {key, kind:'bump', id:s.id, to, title:'Raise a target?', text:`You hit ${fmtAmt(s,c.t)} ${s.n.toLowerCase()} on ${hits} of the last 7 days.`, btn:`Make it ${fmtAmt(s,to)} a day`};
    }
  }
  // the ladder: snacks → 8-min → short → full
  const recent = guided().filter(g=>g.date > weekAgo);
  const cnt = m => recent.filter(g=>sessMode(g)===m).length;
  const snackDays = last7.filter(hasSnacks).length;
  let n = null;
  if(cnt('full') >= 1 || recent.some(g=>g.date===today)) return null;
  if(cnt('short') >= 2) n = {m:'full', title:'Next step', text:'Two short sessions this week. Try one full session (~20–25 min) when you have the time.', btn:'Start a full session'};
  else if(cnt('mini') >= 2) n = {m:'short', title:'Next step', text:'Two 8-minute sessions done. The next small step is one short session (~12 min) this week.', btn:'Start a short session'};
  else if(snackDays >= 4 && !recent.length) n = {m:'mini', title:'Ready for a bit more?', text:`Snacks on ${snackDays} of the last 7 days. Add one 8-minute session this week — just one.`, btn:'Start 8 minutes'};
  if(!n) return null;
  n.key = `ladder-${n.m}-${wk}`; n.kind = 'mode';
  return off[n.key] ? null : n;
}
function nudgeCard(){
  const n = nudge(); if(!n) return '';
  return `<div class="card nudge"><h3>${n.title}</h3><p>${n.text}</p>
    <div class="row" style="margin-top:8px"><button class="btn pri sm" data-act="nudgego">${n.btn}</button><button class="btn sm ghost" data-act="nudgeoff">Not this week</button></div></div>`;
}

function reportText(weeks){
  const now = new Date(), today = dkey(now), mon0 = mondayOf(now), L = [];
  const st = S.settings, active = SNACKS.filter(s=>{const c=snackCfg(s.id);return c.home||c.office;});
  L.push(`BASELINE REPORT · ${fmtDate(today)} ${now.getFullYear()} · last ${weeks} week${weeks>1?'s':''}`);
  L.push(`Setup: workout level ${st.level}, goal ${st.goal} active days/week, currently in ${st.place} mode.`);
  L.push(`Snack targets/day: ${active.map(s=>{const c=snackCfg(s.id);return `${s.n.toLowerCase()} ${fmtAmt(s,c.t)} (${[c.home&&'home',c.office&&'office'].filter(Boolean).join('+')})`;}).join(', ')}.`);
  for(let w=weeks-1; w>=0; w--){
    const mon = addDays(mon0,-7*w), wk = dkey(mon), days = [];
    for(let i=0;i<7;i++){ const d = addDays(mon,i); if(dkey(d) <= today) days.push(dkey(d)); }

      d.g.forEach(g => parts.push(`WORKOUT ${TPL[g.tpl].name} L${g.level} ${MODES[sessMode(g)].toLowerCase()} ${mins(g.secs)}min${g.frac<0.98?` ${Math.round(g.frac*100)}% done`:''}${g.rating?` rated ${({easy:'too easy',right:'just right',hard:'too hard'})[g.rating]}`:''}${g.note?` note: "${g.note}"`:''}`));
      d.o.forEach(o => parts.push(`${o.act} ${o.secs/60|0}min`));
      const ml = waterOn(k); if(ml) parts.push(`water ${litres(ml)}`);
      const ms = mealsOn(k); if(ms.length) parts.push(`meals ${ms.map(m=>hm(m.ts)+(szTag(m)?`(${szTag(m)})`:'')).join(' ')} = ${fmtP(portionsOn(k))} portions`);
      const fs = fsnOn(k); if(fs.length) parts.push(`food snacks ${fs.map(m=>hm(m.ts)).join(' ')}`);
      const sl = sleepOn(k); if(sl) parts.push(`sleep ${hm(sl.bed)}→${hm(sl.wake)} (${dur(slept(sl))} asleep${sl.awake?`, awake ${fmtMin(sl.awake)} in the night`:''})`);
      if(napOn(k)) parts.push(`nap ${fmtMin(napOn(k))}`);
      GOOD.forEach(g => { const xs = onDay('good',k).filter(x=>x.id===g.id); if(xs.length) parts.push(g.u==='x' ? `${g.n.toLowerCase()} ${xs.length}: ${xs.map(x=>hm(x.ts)).join(' ')}` : xs.map(x=>`${g.n.toLowerCase()} ${x.min}min ${hm(x.ts)}`).join(', ')); });

      const nc = onDay('nic',k); if(nc.length) parts.push(`nicotine ${nc.length}: ${nc.map(x=>`${x.k} ${hm(x.ts)}`).join(' ')}`);

      if(c.note) L.push(`  Notes: ${c.note}`);
      if(c.app) L.push(`  App feedback: ${c.app}`);
    }
    const b = S.body.filter(x=>x.date>=wk && x.date<=dkey(addDays(mon,6)));
    b.forEach(x => L.push(`Body ${fmtDate(x.date)}: ${x.waist!=null?`waist ${x.waist} cm `:''}${x.weight!=null?`weight ${x.weight} kg`:''}`.trim()));

  const ws = S.body.filter(b=>b.waist!=null).sort((a,b)=>a.date<b.date?-1:1);

}
function trackSummary(days){
  const out = [];
  const w = days.map(waterOn).filter(Boolean);
  if(w.length) out.push(`water avg ${litres(Math.round(avg(w)/50)*50)} on ${w.length} logged day${w.length>1?'s':''}, goal hit ${w.filter(v=>v>=S.settings.waterGoal).length}d`);
  const md = days.map(mealsOn).filter(a=>a.length), fdk = days.filter(k=>foodOn(k).length);
  if(fdk.length){
    const lateF = fdk.filter(k=>{ const a = foodOn(k); return minsFrom(a[a.length-1].ts, DAY_START_H) >= (23-DAY_START_H)*60; }).length;
    out.push(`food logged on ${fdk.length} day${fdk.length>1?'s':''}, food snacks avg ${avg(fdk.map(k=>fsnOn(k).length)).toFixed(1)}/day, anything eaten after 23:00 on ${lateF}d`);
  }
  if(md.length){
    const late = md.filter(a=>minsFrom(a[a.length-1].ts, DAY_START_H) >= (23-DAY_START_H)*60).length;
    const pk = days.filter(k=>mealsOn(k).length), bigs = md.flat().filter(m=>msz(m)>=2);
    out.push(`portions avg ${fmtP(Math.round(avg(pk.map(portionsOn))*2)/2)}/day (light ½, big ×2, huge ×3), big or huge meals ${bigs.length} (${bigs.filter(m=>minsFrom(m.ts,DAY_START_H)>=(21-DAY_START_H)*60).length} after 21:00)`);
    out.push(`meals avg ${avg(md.map(a=>a.length)).toFixed(1)}/day on ${md.length} logged day${md.length>1?'s':''}, first ~${fromMins(avg(md.map(a=>minsFrom(a[0].ts,DAY_START_H))),DAY_START_H)}, last ~${fromMins(avg(md.map(a=>minsFrom(a[a.length-1].ts,DAY_START_H))),DAY_START_H)}, last meal after 23:00 on ${late}d`);
  }
  const sl = days.map(sleepOn).filter(x=>x && x.bed);
  if(sl.length) out.push(`sleep avg ${dur(avg(sl.map(slept)))} over ${sl.length} night${sl.length>1?'s':''}, asleep ~${fromMins(avg(sl.map(x=>minsFrom(x.bed,18))),18)}, up ~${fromMins(avg(sl.map(x=>minsFrom(x.wake,0))),0)}`);
  const nps = days.map(napOn).filter(Boolean);
  if(nps.length) out.push(`naps ${nps.length} (avg ${fmtMin(Math.round(avg(nps)))})`);
  GOOD.forEach(g => { const xs = days.flatMap(k=>onDay('good',k)).filter(x=>x.id===g.id); if(!xs.length) return;
    if(g.u==='x'){ const dd = days.filter(k=>onDay('good',k).some(x=>x.id===g.id)).length; out.push(`${g.n.toLowerCase()} ${xs.length} on ${dd} day${dd>1?'s':''}`); }
    else out.push(`${g.n.toLowerCase()} ${xs.length}× (${xs.reduce((a,x)=>a+gAmt(x),0)} min)`); });
  const dd = days.filter(k=>onDay('drinks',k).length);
  if(dd.length){ const all = dd.flatMap(k=>onDay('drinks',k)); out.push(`alcohol on ${dd.length} day${dd.length>1?'s':''}, ≈${all.reduce((a,d)=>a+stdDr(d),0).toFixed(1)} standard drinks total (max ≈${Math.max(...dd.map(k=>onDay('drinks',k).reduce((a,d)=>a+stdDr(d),0))).toFixed(1)} in a day)`); }
  const nd = days.filter(k=>onDay('nic',k).length);
  if(nd.length){ const all = nd.flatMap(k=>onDay('nic',k)); out.push(`nicotine avg ${(all.length/nd.length).toFixed(1)}/day on ${nd.length} logged day${nd.length>1?'s':''} (${kindCount(all,NIC)}), first ~${fromMins(avg(nd.map(k=>minsFrom(onDay('nic',k)[0].ts,DAY_START_H))),DAY_START_H)}`); }
  return out.length ? 'Tracking: ' + out.join('; ') : '';
}

/* ================= charts ================= */
function chartHTML(points, unit){
  if(!points.length) return `<p class="small muted" style="margin:0">No entries yet — add a check-in above.</p>`;
  const W=340, H=160, pl=36, pr=14, pt=12, pb=24;
  const xs = points.map(p=>parseKey(p.date).getTime());
  let x0 = Math.min(...xs), x1 = Math.max(...xs);
  if(x1===x0){ x0 -= 3*864e5; x1 += 3*864e5; }
  const vs = points.map(p=>p.v);
  let lo = Math.min(...vs), hi = Math.max(...vs);
  const step = (hi-lo) > 12 ? 5 : (hi-lo) > 5 ? 2 : 1;
  lo = Math.floor((lo-step*0.5)/step)*step; hi = Math.ceil((hi+step*0.5)/step)*step;
  const X = t => pl + (t-x0)/(x1-x0)*(W-pl-pr);
  const Y = v => pt + (hi-v)/(hi-lo)*(H-pt-pb);
  let g = '';
  const nT = Math.round((hi-lo)/step), every = Math.ceil(nT/4);
  for(let i=0;i<=nT;i+=every){ const v = lo+i*step; g += `<line class="gl" x1="${pl}" x2="${W-pr}" y1="${Y(v)}" y2="${Y(v)}"/><text class="ax" x="${pl-6}" y="${Y(v)+3.5}" text-anchor="end">${v}</text>`; }
  g += `<text class="ax" x="${pl}" y="${H-6}">${fmtDate(points[0].date)}</text>`;
  if(points.length>1) g += `<text class="ax" x="${W-pr}" y="${H-6}" text-anchor="end">${fmtDate(points[points.length-1].date)}</text>`;
  const d = points.map((p,i)=>`${i?'L':'M'}${X(xs[i]).toFixed(1)} ${Y(p.v).toFixed(1)}`).join(' ');
  const pts = points.map((p,i)=>`<circle class="pt" cx="${X(xs[i]).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="4"/>`).join('');
  const data = points.map((p,i)=>({x:+X(xs[i]).toFixed(1), y:+Y(p.v).toFixed(1), t:`${fmtDate(p.date)}: ${p.v.toFixed(1)} ${unit}`}));
  const first = points[0].v, last = points[points.length-1].v, diff = last-first;
  const summ = `<p class="small" style="margin:0 0 6px"><b style="font-size:18px">${last.toFixed(1)} ${unit}</b> <span class="muted">${points.length>1?`${diff>0?'+':''}${diff.toFixed(1)} ${unit} since ${fmtDate(points[0].date)}`:'first entry'}</span></p>`;
  return `${summ}<div class="chart" data-pts='${esc(JSON.stringify(data))}' data-w="${W}"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Line chart, ${points.length} entries">${g}<path class="ln" d="${d}"/>${pts}<line class="xh" y1="${pt}" y2="${H-pb}" x1="-10" x2="-10"/><circle class="hp" r="6" cx="-20" cy="-20"/></svg></div>`;
}
function wireCharts(){
  document.querySelectorAll('.chart').forEach(el => {
    const pts = JSON.parse(el.dataset.pts), W = +el.dataset.w, svg = el.querySelector('svg');
    const xh = svg.querySelector('.xh'), hp = svg.querySelector('.hp');
    const move = e => {
      const r = svg.getBoundingClientRect(), x = (e.clientX - r.left) / r.width * W;
      let best = pts[0]; pts.forEach(p => { if(Math.abs(p.x-x) < Math.abs(best.x-x)) best = p; });
      xh.setAttribute('x1',best.x); xh.setAttribute('x2',best.x);
      hp.setAttribute('cx',best.x); hp.setAttribute('cy',best.y);
      showTip(best.t, r.left + best.x/W*r.width, r.top + best.y/W*r.width);
    };
    const leave = () => { xh.setAttribute('x1',-10); xh.setAttribute('x2',-10); hp.setAttribute('cx',-20); hideTip(); };
    svg.addEventListener('pointermove', move); svg.addEventListener('pointerdown', move); svg.addEventListener('pointerleave', leave);
  });
}
const tipEl = $('#tip');
function showTip(text, x, y){
  tipEl.textContent = text; tipEl.classList.add('on');
  const w = tipEl.offsetWidth, h = tipEl.offsetHeight;
  tipEl.style.left = Math.max(8, Math.min(innerWidth - w - 8, x - w/2)) + 'px';
  tipEl.style.top = Math.max(8, y - h - 12) + 'px';
}
function hideTip(){ tipEl.classList.remove('on'); }
document.addEventListener('pointerover', e => {
  const c = e.target.closest && e.target.closest('[data-tip]');
  if(c){ const r = c.getBoundingClientRect(); showTip(c.dataset.tip, r.left + r.width/2, r.top); }
  else if(!e.target.closest('.chart')) hideTip();
});
document.addEventListener('scroll', hideTip, {passive:true});

document.addEventListener('click', e => {

    case 'start': closeSheet(); startWorkout(a.dataset.tpl); break;

      else { S.settings.mode = n.m; S.settings.modeSetOn = dkey(); save(); startWorkout(nextTpl()); }
      break;
    }
    case 'nudgeoff': { const n = nudge(); if(n){ S.settings.nudgeOff[n.key] = 1; save(); render(); } break; }
    case 'copyweek': copyWeek(a.dataset.w); break;
    case 'repskip': S.settings.reported[a.dataset.w] = 'skip'; save(); render(); break;
    case 'water': track('water', +a.dataset.n); break;
    case 'mealask': mealAsk(); break;
    case 'good': { const n = +a.dataset.n, g = GOOD.find(x=>x.id===a.dataset.id); if(!g) break;
      if(g.u==='x') addLog('good', {ts:Date.now(), id:g.id}, `${g.ic} ${g.n} at ${hm(Date.now())} · ${onDay('good',lday(Date.now())).filter(x=>x.id===g.id).length+1} today`);
      else addLog('good', {ts:Date.now(), id:g.id, min:n}, `${g.n} ${n} min · nice`); break; }
    case 'goodsheet': goodSheet(a.dataset.id); break;
    case 'drink': { const d = {ts:Date.now(), k:a.dataset.k, ml:+a.dataset.ml}; addLog('drinks', d, `${DRINKS[d.k].ic} ${drLabel(d)} at ${hm(d.ts)}`); break; }
    case 'drinksheet': drinkSheet(); break;
    case 'nic': { const k = a.dataset.k; S.settings.nicLast = k; addLog('nic', {ts:Date.now(), k}, `${NIC[k]} at ${hm(Date.now())} · ${onDay('nic',lday(Date.now())).length+1} today`); break; }
    case 'nicsheet': nicSheet(); break;
    case 'del': { const col = a.dataset.col; if(!['meals','drinks','nic','good'].includes(col)) break; S[col] = S[col].filter(e=>e.uid!==a.dataset.uid); save(); render(); (col==='meals' ? mealSheet : RESHEET)?.(); break; }
    case 'awake': { const k = a.dataset.k, v = +a.dataset.v, sl = sleepOn(k);
      if(sl){ if(v) sl.awake = v; else delete sl.awake; save(); render(); } else (SLDRAFT[k] = SLDRAFT[k] || {}).awake = v;
      sleepSheet(); break; }
    case 'nap': { const k = a.dataset.k, v = +a.dataset.v; S.naps = S.naps.filter(n=>n.date!==k); if(v) S.naps.push({date:k, min:v}); save(); render(); sleepSheet(); break; }

    case 'meal': track('meal', +a.dataset.v || 1); break;
    case 'mealsz': { const m = S.meals.find(x=>x.uid===a.dataset.uid); if(m){ m.sz = +a.dataset.v; save(); render(); mealSheet(); } break; }
    case 'fsnack': track('fsnack'); break;
    case 'undo2': if(UNDO){ UNDO(); UNDO = null; save(); render(); toast('Undone'); } break;
    case 'watersheet': waterSheet(); break;
    case 'waterset': S.settings[a.dataset.k] = +a.dataset.v; save(); render(); waterSheet(); break;
    case 'mealsheet': mealSheet(); break;
    case 'mealpast': S.meals.push({...(a.dataset.k?{k:a.dataset.k}:{sz:1}), uid:newUid(), ts:Math.max(Date.now()-3600e3, parseKey(lday(Date.now())).getTime()+DAY_START_H*3600e3)}); save(); render(); mealSheet(); break;
    case 'sleepsheet': sleepSheet(); break;

    case 'sharerep': navigator.share({title:'Baseline report', text:$('#repTxt').value}).catch(()=>{}); break;

      const to = +a.dataset.l, lv = S.settings.level, n = daysAtLevel(lv);
      if(to > lv && (to > lv+1 || n < UNLOCK) && !confirm(`You\u2019ve done ${n} of ${UNLOCK} sessions at level ${lv}. Jumping ahead early is the classic way to get wrecked, skip a few days and stop.\n\nSwitch to level ${to} anyway?`)) break;

    case 'mode': S.settings.mode = a.dataset.m; S.settings.modeSetOn = dkey(); save(); render(); break;
    case 'goal': S.settings.goal = +a.dataset.g; save(); render(); break;
    case 'theme': S.settings.theme = a.dataset.m; save(); applyTheme(); render(); break;
    case 'delbody': if(confirm('Delete this check-in?')){ S.body = S.body.filter(b=>b.date!==a.dataset.d); save(); render(); } break;
    case 'delsess': if(confirm('Delete this session?')){ S.sessions = S.sessions.filter(s=>String(s.ts)!==a.dataset.ts); save(); render(); } break;
    case 'export': exportData(); break;
    case 'reset': if(confirm('Erase all workouts, snacks and logs? This can’t be undone.') && confirm('Really erase everything?')){ S = DEFAULT(); save(); applyTheme(); render(); toast('All data erased'); } break;
  }

document.addEventListener('submit', e => {

  }
  if(f.dataset.form==='snack'){

    const date = fd.get('date') || dkey();
    S.sessions.push({ts:Date.now(), date, kind:'other', act:fd.get('act'), secs:m*60});
    save(); closeSheet(); render(); toast(`${fd.get('act')} logged — nice`);
  }

function exportData(){
  const blob = new Blob([JSON.stringify(S, null, 1)], {type:'application/json'});
  const url = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = url; a.download = `baseline-backup-${dkey()}.json`; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
}
function importData(file){
  const r = new FileReader();
  r.onload = () => {
    try{
      const d = JSON.parse(r.result);
      if(!d || !Array.isArray(d.sessions) || !d.settings) throw 0;
      if(!confirm(`Replace current data with this backup (${d.sessions.length} sessions)?`)) return;
      localStorage.setItem(KEY, JSON.stringify(d)); S = load(); applyTheme(); render(); toast('Backup restored');
    }catch(e){ toast('That file isn’t a Baseline backup'); }
  };
  r.readAsText(file);
}

const vec = (a,len) => { const r = a*Math.PI/180; return [Math.sin(r)*len, Math.cos(r)*len]; };
const addv = (p,a,len) => { const v = vec(a,len); return [p[0]+v[0], p[1]+v[1]]; };
function fk(p, Y){
  const hip = [60+p.hx, Y], sho = addv(hip,p.t,SEG.sh), neck = addv(hip,p.t,SEG.tor), head = addv(neck,p.hd,SEG.hd-SEG.tor);
  const e1 = addv(sho,p.a1[0],SEG.ua), h1 = addv(e1,p.a1[1],SEG.la), e2 = addv(sho,p.a2[0],SEG.ua), h2 = addv(e2,p.a2[1],SEG.la);
  const k1 = addv(hip,p.l1[0],SEG.th), f1 = addv(k1,p.l1[1],SEG.sn), k2 = addv(hip,p.l2[0],SEG.th), f2 = addv(k2,p.l2[1],SEG.sn);
  return {hip,sho,neck,head,e1,h1,e2,h2,k1,f1,k2,f2};
}
function lowest(J){
  let m = -1e9;
  for(const k of ['hip','neck','e1','h1','e2','h2','k1','f1','k2','f2']) m = Math.max(m, J[k][1]);
  return Math.max(m, J.head[1] + SEG.hr - 2.5);
}
function ik(R, T, a, b, bend){
  const dx = T[0]-R[0], dy = T[1]-R[1], d0 = Math.hypot(dx,dy) || 0.001;
  const d = Math.max(Math.abs(a-b)+0.01, Math.min(d0, a+b-0.01));
  const base = Math.atan2(dy,dx), A = Math.acos(Math.max(-1, Math.min(1, (a*a+d*d-b*b)/(2*a*d))));
  const c1 = [R[0]+a*Math.cos(base+A), R[1]+a*Math.sin(base+A)], c2 = [R[0]+a*Math.cos(base-A), R[1]+a*Math.sin(base-A)];
  const pickF = {f:(p,q)=>p[0]>=q[0], b:(p,q)=>p[0]<=q[0], u:(p,q)=>p[1]<=q[1], d:(p,q)=>p[1]>=q[1]}[bend] || ((p,q)=>p[0]>=q[0]);
  const j = pickF(c1,c2) ? c1 : c2;
  const end = d0 <= a+b ? T : [R[0]+dx/d0*(a+b), R[1]+dy/d0*(a+b)];
  return [j, end];
}
const ANIMC = {};
function prepAnim(id){
  if(ANIMC[id]) return ANIMC[id];
  const A = ANIM[id] || ANIM_IDLE;
  const ks = A.k.map(raw => {
    const p = K(DEFP, raw);
    if(raw.a){ if(!raw.a1) p.a1 = raw.a; if(!raw.a2) p.a2 = raw.a; }
    if(raw.l){ if(!raw.l1) p.l1 = raw.l; if(!raw.l2) p.l2 = raw.l; }
    if(p.hd == null) p.hd = p.t;
    p.Y = raw.hy == null ? GP - lowest(fk(p,0)) - p.lift : GP - raw.hy - p.lift;
    return p;
  });
  const J0 = fk(ks[0], ks[0].Y), tg = {};
  (A.plant||[]).forEach(k => { const pt = [...J0[k]]; if(Math.abs(pt[1]-GP) < 10) pt[1] = GP; tg[k] = pt; });
  const n = ks.length, seq = A.seq || 'pp', segs = [], ms = i => ks[i].ms || A.ms || 900;
  if(n === 1) segs.push({a:0,b:0,ms:1000});
  else if(seq === 'pp'){ for(let i=0;i<n-1;i++) segs.push({a:i,b:i+1,ms:ms(i+1)}); for(let i=n-1;i>0;i--) segs.push({a:i,b:i-1,ms:ms(i)}); }
  else { for(let i=0;i<n-1;i++) segs.push({a:i,b:i+1,ms:ms(i+1)}); if(seq === 'loop') segs.push({a:n-1,b:0,ms:ms(0)}); }
  const C = {A, ks, tg, segs, period:segs.reduce((s,x)=>s+x.ms,0)};
  let lo = 1e9, hi = -1e9;
  for(let i=0;i<=24;i++){
    const J = poseAt(C, C.period*i/24);
    for(const k of ['hip','sho','neck','e1','h1','e2','h2','k1','f1','k2','f2']){ lo = Math.min(lo, J[k][0]); hi = Math.max(hi, J[k][0]); }
    lo = Math.min(lo, J.head[0]-SEG.hr); hi = Math.max(hi, J.head[0]+SEG.hr);
  }
  C.dx = +(60 - (lo+hi)/2).toFixed(1);
  return ANIMC[id] = C;
}
function lerpPose(p, q, u){
  const r = {};
  for(const k of ['t','hd','hx','Y','arch']) r[k] = p[k] + (q[k]-p[k])*u;
  for(const k of ['a1','a2','l1','l2']) r[k] = [p[k][0]+(q[k][0]-p[k][0])*u, p[k][1]+(q[k][1]-p[k][1])*u];
  return r;
}

    const arm = k[0]==='h', n = k[1], jn = (arm?'e':'k')+n;
    const r = ik(arm ? J.sho : J.hip, T, arm?SEG.ua:SEG.th, arm?SEG.la:SEG.sn, bend[jn]);
    J[jn] = r[0]; J[k] = r[1];
  }
  J.arch = p.arch;
  return J;
}
function poseAt(C, ms){
  let t = C.period ? ms % C.period : 0, s = C.segs[0];
  for(const sg of C.segs){ if(t < sg.ms){ s = sg; break; } t -= sg.ms; }
  const u = s.ms ? 0.5 - 0.5*Math.cos(Math.PI*Math.min(1, t/s.ms)) : 1;
  return solvePose(C, lerpPose(C.ks[s.a], C.ks[s.b], u));
}
const RMQ = matchMedia('(prefers-reduced-motion: reduce)');
const FIGS = new Set(); let figRAF = 0;
function mountFig(svg, id){
  if(svg._fig) FIGS.delete(svg._fig);
  const C = prepAnim(id), A = C.A, far = A.v==='f' ? '' : ' far';
  svg.setAttribute('viewBox', A.vb || '0 -8 120 112');
  svg.innerHTML = `<line class="fg-g" x1="4" x2="116" y1="100.6" y2="100.6"/><g transform="translate(${C.dx} 0)">${A.prop||''}
    <path class="fg${far}" data-j="a2"/><path class="fg${far}" data-j="l2"/><path class="fg" data-j="tr"/><circle class="fg-h" r="${SEG.hr}"/>
    <path class="fg" data-j="l1"/><path class="fg" data-j="a1"/>
    ${A.rk?'<g class="fg-rk"><line/><ellipse rx="4.2" ry="6.4"/></g>':''}${A.pack?'<rect class="fg-pk" width="9" height="10" rx="2"/>':''}</g>`;
  const q = s => svg.querySelector(s);
  const f = {svg, C, t0:performance.now(), held:0, el:{a1:q('[data-j=a1]'),a2:q('[data-j=a2]'),l1:q('[data-j=l1]'),l2:q('[data-j=l2]'),tr:q('[data-j=tr]'),hd:q('.fg-h'),rk:q('.fg-rk'),pk:q('.fg-pk')}};
  svg._fig = f; FIGS.add(f);
  drawFig(f, RMQ.matches ? solvePose(C, C.ks[Math.min(1, C.ks.length-1)]) : poseAt(C, 0));
  if(!RMQ.matches && !figRAF) figRAF = requestAnimationFrame(figFrame);
  return f;
}
function holdFig(f, on){
  if(!f) return;
  if(on && !f.held) f.held = performance.now();
  else if(!on && f.held){ f.t0 += performance.now() - f.held; f.held = 0; }
}
function figFrame(now){
  figRAF = 0;
  for(const f of FIGS){
    if(!f.svg.isConnected){ FIGS.delete(f); continue; }
    if(!f.held) drawFig(f, poseAt(f.C, now - f.t0));
  }
  if(FIGS.size && !RMQ.matches) figRAF = requestAnimationFrame(figFrame);
}
function drawFig(f, J){
  const P = p => `${p[0].toFixed(1)} ${p[1].toFixed(1)}`, e = f.el;
  e.a1.setAttribute('d', `M${P(J.sho)}L${P(J.e1)}L${P(J.h1)}`);
  e.a2.setAttribute('d', `M${P(J.sho)}L${P(J.e2)}L${P(J.h2)}`);
  e.l1.setAttribute('d', `M${P(J.hip)}L${P(J.k1)}L${P(J.f1)}`);
  e.l2.setAttribute('d', `M${P(J.hip)}L${P(J.k2)}L${P(J.f2)}`);
  const dx = J.neck[0]-J.hip[0], dy = J.neck[1]-J.hip[1], len = Math.hypot(dx,dy) || 1;
  // arch > 0 bows the spine toward the back (cat / crunch), < 0 toward the belly
  const nx = -dy/len, ny = dx/len, sgn = -1;
  const cx = J.hip[0] + dx/2 + nx*J.arch*2*sgn, cy = J.hip[1] + dy/2 + ny*J.arch*2*sgn;
  e.tr.setAttribute('d', `M${P(J.hip)}Q${cx.toFixed(1)} ${cy.toFixed(1)} ${P(J.neck)}`);
  e.hd.setAttribute('cx', J.head[0].toFixed(1)); e.hd.setAttribute('cy', J.head[1].toFixed(1));
  if(e.rk){
    const n = f.C.A.rk, h = J['h'+n], el = J['e'+n];
    const vx = h[0]-el[0], vy = h[1]-el[1], l = Math.hypot(vx,vy) || 1, ux = vx/l, uy = vy/l;
    const ln = e.rk.querySelector('line'), ep = e.rk.querySelector('ellipse');
    ln.setAttribute('x1', h[0]); ln.setAttribute('y1', h[1]); ln.setAttribute('x2', h[0]+ux*8); ln.setAttribute('y2', h[1]+uy*8);
    const cxr = h[0]+ux*14, cyr = h[1]+uy*14, ang = Math.atan2(uy,ux)*180/Math.PI - 90;
    ep.setAttribute('cx', cxr.toFixed(1)); ep.setAttribute('cy', cyr.toFixed(1)); ep.setAttribute('transform', `rotate(${ang.toFixed(1)} ${cxr.toFixed(1)} ${cyr.toFixed(1)})`);
  }
  if(e.pk){ e.pk.setAttribute('x', (J.h1[0]-4.5).toFixed(1)); e.pk.setAttribute('y', (J.h1[1]-1).toFixed(1)); }
}

/* ================= audio / voice / wake ================= */
let AC = null;
function ensureAudio(){ try{ AC = AC || new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==='suspended') AC.resume(); }catch(e){} }
function beep(freq=660, len=0.1, vol=0.18){
  if(!S.settings.sound || !AC) return;
  try{
    const o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime;
    o.type = 'sine'; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t+0.01); g.gain.exponentialRampToValueAtTime(0.0001, t+len);
    o.connect(g).connect(AC.destination); o.start(t); o.stop(t+len+0.02);
  }catch(e){}
}
function say(text){
  if(!S.settings.voice || !('speechSynthesis' in window)) return;
  try{ speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text); u.rate = 1.03; u.lang = 'en-US'; speechSynthesis.speak(u); }catch(e){}
}
let wakeLock = null;
async function wake(){ try{ if('wakeLock' in navigator && !wakeLock) { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', ()=>{ wakeLock = null; }); } }catch(e){} }
function unwake(){ try{ wakeLock?.release(); }catch(e){} wakeLock = null; }
document.addEventListener('visibilitychange', () => { if(document.visibilityState==='visible' && P && !P.finished) wake(); });

/* ================= player ================= */
let P = null;
const ICON = {
  pause:'<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1.2"/><rect x="14" y="5" width="4" height="14" rx="1.2"/></svg>',
  play:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg>',
  next:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M5 6.2v11.6a1 1 0 0 0 1.55.83L15 13v4.8a1 1 0 0 0 2 0V6.2a1 1 0 0 0-2 0V11L6.55 5.37A1 1 0 0 0 5 6.2z"/></svg>',
  prev:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 6.2v11.6a1 1 0 0 1-1.55.83L9 13v4.8a1 1 0 0 1-2 0V6.2a1 1 0 0 1 2 0V11l8.45-5.63A1 1 0 0 1 19 6.2z"/></svg>'
};
const RING_C = 2*Math.PI*54;

function startWorkout(tid){
  ensureAudio();
  const level = S.settings.level, variant = variantFor(tid), mode = curMode();
  const steps = buildSession(tid, level, variant, mode);
  P = {tid, level, variant, mode, steps, i:0, stepMs:0, activeMs:0, lastTick:performance.now(), paused:false, beeped:-1, switched:false, planned:totalSecs(steps), finished:false};
  const el = $('#player');
  el.innerHTML = `
    <div class="pl-top"><button class="ib" data-p="end" aria-label="End workout">✕</button><div class="ph" id="pPh"></div><div class="rm" id="pRm"></div></div>
    <div class="pbar"><i id="pBar"></i></div>
    <div class="pl-main" style="position:relative">
      <span class="kind" id="pKind"></span>
      <div class="mvname" id="pName"></div>
      <div class="mvsub" id="pSub"></div>
      <div class="figbox"><svg id="pFig" aria-hidden="true"></svg></div>
      <div class="ring"><svg viewBox="0 0 120 120"><circle class="tr" cx="60" cy="60" r="54"/><circle class="pr" id="pRing" cx="60" cy="60" r="54" stroke-dasharray="${RING_C}" stroke-dashoffset="0"/></svg><div class="num" id="pNum"></div></div>
      <div class="how" id="pHow"></div>
      <div class="ez" id="pEz"></div>
      <div class="nextup" id="pNext"></div>
      <div class="flash" id="pFlash"></div>
    </div>
    <div class="pl-ctl">
      <button class="cb" data-p="prev" aria-label="Previous">${ICON.prev}</button>
      <button class="cb main" data-p="pause" id="pPause" aria-label="Pause">${ICON.pause}</button>
      <button class="cb" data-p="next" aria-label="Skip">${ICON.next}</button>
    </div>`;
  el.classList.add('on'); el.classList.remove('paused');
  document.body.style.overflow = 'hidden';
  enterStep();
  clearInterval(P.timer); P.timer = setInterval(tick, 200);
  wake();
}

function stepTitle(st){
  if(st.id) return LIB[st.id].n;
  return st.label;
}
function enterStep(){
  const st = P.steps[P.i];
  P.stepMs = 0; P.beeped = -1; P.switched = false;
  const el = $('#player');
  const k = st.kind; el.dataset.k = k;
  $('#pKind').textContent = {work:'Work', warm:st.phase==='Cool-down'?'Cool-down':'Warm-up', rest:'Rest', ready:'Ready'}[k];
  $('#pPh').textContent = `${TPL[P.tid].name} · ${st.phase}`;
  const nx = st.next ? LIB[st.next] : null;
  const figId = st.id || st.next;
  const fsvg = $('#pFig');
  if(figId && fsvg._figId !== figId){ mountFig(fsvg, figId); fsvg._figId = figId; }
  holdFig(fsvg._fig, P.paused);
  if(st.id){
    const m = LIB[st.id];
    $('#pName').textContent = m.n;
    $('#pSub').textContent = m.side ? `${m.sw ? m.sw : 'Switch sides'} at halfway` : '';
    $('#pHow').textContent = m.how;
    $('#pEz').textContent = m.ez ? `Easier: ${m.ez}` : '';
    $('#pNext').innerHTML = nx ? `Then: <b>${esc(nx.n)}</b>` : 'Last one!';
    say(m.n);
  }else{
    $('#pName').textContent = st.label;
    $('#pSub').textContent = nx ? `Next: ${nx.n}` : '';
    $('#pHow').textContent = nx ? nx.how : '';
    $('#pEz').textContent = nx && nx.ez ? `Easier: ${nx.ez}` : '';
    $('#pNext').innerHTML = st.label==='Round break' ? 'Water, breathe, shake it out.' : '';
    if(st.kind==='ready') say(`Get ready. First up, ${nx.n}`);
    else if(st.label==='Round break') say(`Round done. Breather. Next, ${nx.n}`);
    else if(nx) say(`${st.label==='Rest'?'Rest. ':''}Next, ${nx.n}`);
  }
  update();
}
function update(){
  const st = P.steps[P.i], left = st.dur - P.stepMs/1000;
  $('#pNum').textContent = Math.max(0, Math.ceil(left));
  $('#pRing').style.strokeDashoffset = (RING_C * (1 - Math.max(0,left)/st.dur)).toFixed(2);
  let rem = Math.max(0,left); for(let j=P.i+1;j<P.steps.length;j++) rem += P.steps[j].dur;
  $('#pRm').textContent = fmtClock(rem) + ' left';
  $('#pBar').style.width = (100*(1 - rem/P.planned)).toFixed(2) + '%';
}
function tick(){
  if(!P || P.finished) return;
  const now = performance.now(), dt = Math.min(now - P.lastTick, 1500); P.lastTick = now;
  if(P.paused) return;
  P.stepMs += dt; P.activeMs += dt;
  const st = P.steps[P.i], el = st.dur - P.stepMs/1000, whole = Math.ceil(el);
  if(whole>=1 && whole<=3 && whole!==P.beeped){ P.beeped = whole; beep(660, 0.09); }
  if(st.side && !P.switched && P.stepMs/1000 >= st.dur/2){
    P.switched = true; const sw = LIB[st.id].sw || 'Switch sides';
    beep(880, 0.14); say(sw); flash(sw);
  }
  if(el <= 0){ advance(true); return; }
  update();
}
function flash(txt){ const f = $('#pFlash'); f.textContent = txt; f.classList.add('on'); setTimeout(()=>f.classList.remove('on'), 1400); }
function advance(auto){
  if(P.i >= P.steps.length-1){ finish(true); return; }
  P.i++; if(auto) beep(P.steps[P.i].kind==='rest'?520:990, 0.22, 0.22);
  enterStep();
}
function back(){
  if(P.stepMs > 3000 || P.i===0){ enterStep(); return; }
  P.i--; enterStep();
}
function togglePause(){
  P.paused = !P.paused; P.lastTick = performance.now();
  $('#player').classList.toggle('paused', P.paused);
  const b = $('#pPause'); b.innerHTML = P.paused ? ICON.play : ICON.pause; b.setAttribute('aria-label', P.paused?'Resume':'Pause');
  if(P.paused){ try{ speechSynthesis.cancel(); }catch(e){} }
  holdFig($('#pFig')?._fig, P.paused);
}
function doneSecs(){ let s = P.stepMs/1000; for(let j=0;j<P.i;j++) s += P.steps[j].dur; return Math.min(P.planned, s); }

function finish(complete){
  clearInterval(P.timer); P.finished = true; unwake();
  const frac = complete ? 1 : doneSecs()/P.planned;
  P.frac = frac; P.secs = Math.round(P.activeMs/1000);
  if(complete){ beep(784,0.15); setTimeout(()=>beep(988,0.15),160); setTimeout(()=>beep(1319,0.3),320); say('Workout complete. Great job.'); }
  const t = TPL[P.tid];
  $('#player').dataset.k = 'done';
  $('#player').innerHTML = `
    <div class="pl-top"><div class="ph">${t.ic} ${t.name}</div></div>
    <div class="pl-main">
      <div style="font-size:54px;line-height:1">${complete?'🎾':'⏸️'}</div>
      <div class="mvname">${complete?'Session done':'Ended early'}</div>
      <div class="mvsub">${fmtClock(P.secs)} active · level ${P.level}${P.mode!=='full'?' \u00b7 '+MODES[P.mode]:''}${complete?'':` · ${Math.round(frac*100)}% of plan`}</div>
      <p style="margin-top:18px;font-weight:600">How did that feel?</p>
      <div class="rate" role="radiogroup">
        <button data-r="easy"><span>😌</span>Too easy</button>
        <button data-r="right"><span>👌</span>Just right</button>
        <button data-r="hard"><span>🥵</span>Too hard</button>
      </div>
      <textarea id="pNote" placeholder="Note (optional) — e.g. knee felt fine, push-ups on knees" style="max-width:420px"></textarea>
      <div id="pSuggest" style="max-width:420px;width:100%"></div>
      <div class="row" style="margin-top:14px;justify-content:center;width:100%;max-width:420px">
        <button class="btn pri" style="flex:1;padding:13px" data-p="save">Save</button>
        <button class="btn ghost" data-p="discard">Discard</button>
      </div>
      ${frac<0.15?'<p class="small muted">Barely started — saving still counts it for today.</p>':''}
    </div>`;
}

function closePlayer(){
  if(P){ clearInterval(P.timer); }
  P = null; unwake(); try{ speechSynthesis.cancel(); }catch(e){}
  const el = $('#player'); el.classList.remove('on','paused'); el.innerHTML = '';
  document.body.style.overflow = '';
  render();
}

function suggestion(rating){
  if(P.mode==='mini') return rating==='easy' ? {msg:'Easy is the point of the 8-minute version. Next time, try the full one.'} : null;
  const lv = P.level, prev = guided().filter(s=>s.level===lv && sessMode(s)!=='mini').slice(-1)[0];
  const done = levelDays(lv); if(P.frac >= 0.8) done.add(dkey());
  const n = done.size;
  if(rating==='easy' && lv<4 && n < UNLOCK) return {msg:`Felt easy \u2014 good sign. Level ${lv+1} unlocks after ${UNLOCK} sessions at level ${lv}; this is ${n} of ${UNLOCK}. Lungs adapt in days, tendons in weeks.`};
  if(rating==='easy' && lv<4 && prev && prev.rating==='easy') return {to:lv+1, msg:`${n} sessions in and two \u201ctoo easy\u201d in a row. Ready for level ${lv+1} (${LEVELS[lv+1].name}: ${LEVELS[lv+1].d})?`};
  if(rating==='hard' && lv>1 && prev && prev.rating==='hard') return {to:lv-1, msg:`Two tough ones in a row. Drop to level ${lv-1} for a week? No shame in that — consistency wins.`};
  return null;
}

$('#player').addEventListener('click', e => {
  if(!P) return;
  const r = e.target.closest('[data-r]');
  if(r){
    P.rating = r.dataset.r;
    document.querySelectorAll('.rate button').forEach(b=>b.classList.toggle('on', b===r));
    const sg = suggestion(P.rating); P.suggest = sg;
    $('#pSuggest').innerHTML = sg ? `<div class="card" style="text-align:left"><p style="margin:0">${sg.msg}</p>${sg.to?'<label class="switch" style="margin-top:8px"><input type="checkbox" id="pApply" checked> Change level when I save</label>':''}</div>` : '';
    return;
  }
  const b = e.target.closest('[data-p]'); if(!b) return;
  switch(b.dataset.p){
    case 'pause': togglePause(); break;
    case 'next': advance(false); break;
    case 'prev': back(); break;
    case 'end':
      if(P.i <= 1 && P.stepMs < 15000){ closePlayer(); break; }
      if(!P.paused) togglePause();
      if(confirm('End the workout now? You can still save what you did.')) finish(false);
      break;
    case 'save': {
      const note = ($('#pNote')?.value || '').trim().slice(0,200);
      S.sessions.push({ts:Date.now(), date:dkey(), kind:'guided', tpl:P.tid, level:P.level, variant:P.variant, mode:P.mode, short:P.mode==='short', secs:P.secs, frac:+P.frac.toFixed(3), rating:P.rating||null, note});
      let msg = 'Saved. See you tomorrow.';
      if(P.suggest?.to && $('#pApply')?.checked){ S.settings.level = P.suggest.to; msg = `Saved · now on level ${P.suggest.to}`; }
      S.settings.welcomed = true;
      save(); TAB = 'today'; closePlayer(); toast(msg); break;
    }
    case 'discard': if(confirm('Discard this workout without saving?')) closePlayer(); break;
  }
});
document.addEventListener('keydown', e => {
  if(!P || P.finished || !$('#player').classList.contains('on')) { if(e.key==='Escape') closeSheet(); return; }
  if(e.key===' '){ e.preventDefault(); togglePause(); }
  else if(e.key==='ArrowRight') advance(false);
  else if(e.key==='ArrowLeft') back();
});
window.addEventListener('beforeunload', e => { if(P && !P.finished){ e.preventDefault(); e.returnValue = ''; } });

applyTheme();
render();
// new versions install in the background and the app reloads itself (never mid-workout); data stays in localStorage
if('serviceWorker' in navigator && location.protocol==='https:'){
  const hadCtl = !!navigator.serviceWorker.controller; let reloading = false;
  navigator.serviceWorker.register('sw.js').then(reg => {
    document.addEventListener('visibilitychange', () => { if(!document.hidden) reg.update().catch(()=>{}); });
  }).catch(()=>{});
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if(!hadCtl || reloading) return;
    const go = () => { if(P && !P.finished) return setTimeout(go, 5000); if($('#scrim')) return setTimeout(go, 3000); reloading = true; location.reload(); };
    go();
  });
}
if(navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(()=>{});
// keep "today" right when the app is reopened on a new day
let lastDay = dkey()+lday(Date.now());
document.addEventListener('visibilitychange', () => { const d = dkey()+lday(Date.now()); if(!document.hidden && d!==lastDay && !(P && !P.finished)){ lastDay = d; render(); } });
</script>
</body>
